name: Tests et publication GitHub Pages S12
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier le contenu
        run: npm run check
      - name: Tester les données
        run: npm test
      - name: Construire Vite
        run: npm run build
      - name: Installer Pages
        uses: actions/configure-pages@v5
      - name: Exporter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
