 ['03 · Contrôle qualité',()=>`Évalue ce guide pratique V1 sans le réécrire intégralement.\n\n${guideV1()}\n\nCritères : objectif, public, prérequis, ordre des étapes, exactitude, actionnabilité, erreurs à éviter, checklist et promesses. Réponds : points solides ; corrections prioritaires ; informations à vérifier ; décision proposée : À COMPLÉTER / À SIMPLIFIER / PRÊT POUR RELECTURE. La décision finale reste humaine.`],
 ['04 · Correction ciblée V2',()=>`Applique uniquement les corrections que j’ai validées.\n\nGUIDE V1 :\n${guideV1()}\n\nCORRECTIONS À APPLIQUER :\n${value(state.correctionLog)}\n\nProduis une proposition V2 à relire. Conserve le public et l’objectif, liste les modifications. Ne prétends pas que la V2 a été validée.`],
 ['05 · Portfolio',()=>`Prépare une proposition de trace portfolio pour S12, sans inventer les travaux du participant.\n\nTitre : ${value(state.title)}\nCe que j’ai appris : ${value(state.lessons)}\nCorrections : ${value(state.correctionLog)}\nProchain progrès : ${value(state.portfolioAction)}\n\nFichiers attendus : 03-documents/guide-pratique-v1.md ; 07-portfolio/preuve-seance-12.md. Indique ce qui doit être confirmé par l’humain.`]
];

function accueil(){return `<main class="page"><div class="hero"><div class="hero-text"><div class="hero-kicker">SÉANCE 12 · ATELIER PRATIQUE · MODULE 03</div><h1>Du plan au <em>guide professionnel.</em></h1><p>Produire avec l’IA une V1 actionnable, la relire, créer une V2 corrigée et documenter chaque étape de votre progression.</p><div class="hero-actions"><a class="btn primary" href="#presentation">Voir les 22 diapositives ↗</a><a class="btn light" href="#atelier">Ouvrir l’atelier V1 → V2</a></div><div class="hero-meta">Lundi 2 novembre 2026 · 19h00 · Pilotage : Prof. Abderrahman EL HISSE</div></div><div class="hero-art" aria-hidden="true"><div class="art-back">S11<br>PLAN</div><div class="art-front"><b>GUIDE PRATIQUE</b><span>01 Comprendre</span><span>02 Préparer</span><span>03 Produire</span><span>04 Vérifier</span><span>05 Améliorer</span><strong>V1 → V2</strong></div></div></div><div class="stats">${[['22','Diapositives'],['04','Cas fictifs'],['12','Flashcards'],['10','Questions quiz']].map(([x,t])=>`<div><strong>${x}</strong><span>${t}</span></div>`).join('')}</div><section class="content-block"><div class="eyebrow">LE FIL ROUGE DU MODULE</div><h2>Quatre productions, un dossier professionnel.</h2><div class="progression">${[['S09','Note de cadrage'],['S10','Fiche projet V1'],['S11','Plan du guide'],['S12','Guide V1 et V2']].map((x,i)=>`<div class="prog ${i===3?'focus':''}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><div class="twocol"><section class="panel"><h2>Votre mission pendant l’atelier</h2><p>Rédiger un guide court, relire avec des critères, expliquer les corrections et exporter vos preuves dans le portfolio.</p><ul class="checklist-simple"><li>Importer le plan S11</li><li>Rédiger au moins trois étapes actionnables</li><li>Conserver la V1, produire une V2 modifiée</li><li>Exporter grille et preuve S12</li></ul></section><section class="panel outline"><h2>Règle de qualité</h2><blockquote>« La V1 sert à exister. La correction ser <div class="slide-controls"><span class="pill">${String(s.num).padStart(2,'0')} / 22 · ${esc(s.axis)}</span><span class="slide-progress"><i style="width:${100*(slide+1)/22}%"></i></span>${btn('Notes formateur','toggleNotes')}${btn('Plein écran','fullScreen')}</div><section class="slide" id="slideDeck"><div class="slide-upper"><div><span class="eyebrow">MODULE 03 · SÉANCE 12</span><h2>${esc(s.title)}</h2><p class="slide-description">${esc(s.description)}</p></div><div class="slide-symbol">${String(s.num).padStart(2,'0')}</div></div><div class="slide-card-grid">${s.points.map((p,i)=>`<div class="slide-card"><span>0${i+1}</span><p>${esc(p)}</p></div>`).join('')}</div><div class="slide-bottom"><span>LAB-NUMÉRIQUE-IA</span><span>DU PLAN S11 → GUIDE V1 → CORRECTION V2</span></div></section>${notes?`<div class="speaker-note"><b>Note formateur :</b> ${esc(s.note)}</div>`:''}<div class="pager">${btn('← Précédent','prevSlide')}${btn('Suivant →','nextSlide','primary')}</div><div class="slide-dots" aria-label="Navigation par diapositives">${DATA.slides.map((p,i)=>`<button type="button" title="Diapositive ${i+1}" aria-label="Aller à la diapositive ${i+1}" data-slide="${i}" class="${i===slide?'on':''}"></button>`).join('')}</div></main>`}

<section class="content-block"><h2>Huit étapes de production</h2><div class="method-grid">${['Besoin réel','Cadrage','Prompt','Production V1','Contrôle humain','Correction V2','Documentation','Preuve portfolio'].map((t,i)=>`<div class="method"><b>${String(i+1).padStart(2,'0')}</b><h3>${t}</h3><p>${['Reprendre l’objectif et le public du projet.','Relire le plan S11 et ses limites.','Fournir contexte et contraintes à l’IA.','Rédiger les étapes et la checklist.','Tester, vérifier les faits et le sens.','Modifier le texte et consigner les changements.','Classer les versions et le prompt.','Ajouter une trace explicite au portfolio.'][i]}</p></div>`).join('')}</div></section><div class="twocol"><section class="panel"><h2>Guide pratique = actions vérifiables</h2><ul><li>Objectif et lecteur explicités</li><li>Prérequis et trois étapes minimum</li><li>Erreurs fréquentes et correction proposée</li><li>Checklist, points à vérifier et amélioration</li></ul></section><section class="panel"><h2>V1 et V2 : deux preuves distinctes</h2><p>La V1 est le premier guide documenté. La V2 suppose un texte réellement corrigé, un journal de changements et une relecture déclarée.</p><p class="note">Le logiciel ne décide jamais que la production est « VALIDÉE ».</p></section></div></main>`}
function demonstrations(){return `<main class="page">${pageTitle('4 EXEMPLES FICTIFS','Observer avant de produire','Chaque cas propose un public, un résultat, trois actions et des points à vérifier.')}
<div class="demo-grid">${DATA.cases.map((c,i)=>`<article class="panel demo-card"><span class="tag">DÉMONSTRATION ${i+1} · FICTIVE</span><h2>${esc(c.name)}</h2><p>${esc(c.goal)}</p><small>${esc(c.field)}</small><div class="demo-steps">${c.steps.map((st,j)=>`<div><b>${j+1}. ${esc(st[0])}</b><p>${esc(st[1])}</p><small>Contrôle : ${esc(st[2])}</small></div>`).join('')}</div>${btn('Utiliser ce cas dans l’atelier','loadCase'+i,'primary')}</article>`).join('')}</div><p class="note">Tous les cas sont pédagogiques. Ils ne constituent ni des procédures réelles ni des résultats d’appel à un modèle IA.</p></main>`}
function atelier(){return `<main class="page">${pageTitle('ATELIER · PRODUCTION DOCUMENTAIRE','Mon guide V1 → V2','Complétez les rubriques, exportez la V1, réalisez une correction humaine puis exportez la V2.')}
<div class="notice"><b>Parcours en quatre temps</b><span>1. Importer le plan S11 → 2. Structurer la V1 → 3. Corriger la V2 → 4. Conserver les preuves.</span></div><section class="panel"><h2>1 · Reprendre le dossier professionnel</h2><div class="import-grid">${[['plan','Plan S11'],['project','Fiche projet S10'],['note','Note de cadrage S09']].map(([key,t])=>`<label class="import"><span>${t}</span><input type="file" accept=".txt,.md,text/plain,text/markdown" data-import="${key}"><small>Importer un fichier .md ou .txt (taille maximale 1 Mo)</small></label>`).join('')}</div>${label('plan','Plan S11 utilisé pour préparer le guide','Collez le plan relu de la séance 11',3)}<details><summary>Voir les documents S09 et S10 importés (facultatif)</summary>${label('project','Fiche projet S10','',3)}${label('note','Note de cadrage S09','',3)}</details></section>
<section class="panel"><h2>2 · Construire la première version V1</h2><div class="fields-grid">${label('title','Titre du guide','Ex. : Guide pour...',2)}${label('audience','Public visé','Pour qui ?',2)}${label('goal','Objectif du guide','Ce guide aide à...',2)}${label('outcome','Résultat attendu','À la fin, le lecteur pourra...',2)}</div>${label('prereqs','Prérequis — une ligne par élément','Document, outil ou connaissance nécessaire',3)}<div class="step-grid">${[1,2,3].map(i=>`<div class="step-editor"><h3>Étape ${i}</h3>${label('step'+i+'Title','Nom de l’étape','Verbe d’action',2)}${label('step'+i+'Actions','Actions — une par ligne','Action 1\nAction 2',4)}${label('step'+i+'Check','Résultat à vérifier','Comment savoir que c’est fait ?',2)}</div>`).join('')}</div><div class="fields-grid">${label('errors','Erreurs à éviter','Une erreur par ligne',3)}${label('checklist','Checklist finale','Un critère concret par ligne',3)}${label('verify','Points à vérifier par l’humain','Indiquer À VÉRIFIER si nécessaire',3)}${label('improve','Prochaine amélioration','Quelle amélioration concrète envisager ?',3)}</div><div class="editor-actions">${btn('Prévisualiser ma V1','previewV1')}${btn('Télécharger la V1 (.md)','exportV1','primary')}${btn('Exporter mon prompt','exportPrompt')}${btn('Charger un exemple fictif','sampleCase')}${btn('Vider mon formulaire','clearForm')}</div><div class="preview-block"><div class="preview-head"><strong>Aperçu Markdown — version en cours</strong><span>V1 · À RELIRE</span></div><pre id="markdownPreview" tabindex="0">${esc(guideV1())}</pre></div></section>
<section class="panel revision"><h2>3 · Documenter les corrections et préparer la V2</h2><p>La V2 doit différer de la V1. La correction appartient au participant, pas au logiciel.</p><div class="editor-actions">${btn('Reprendre la V1 exportée comme base','prefillV2')}${btn('Copier prompt de correction','copyCorrection')}</div>${label('revisedV2','Contenu Markdown corrigé de la V2','Reprenez la V1 exportée puis MODIFIEZ réellement le texte.',8)}${label('correctionLog','Journal de corrections effectuées — une ligne par modification','Ex. : J’ai clarifié l’étape 2 ; j’ai retiré une affirmation non vérifiée.',4)}${label('peerFeedback','Retour de relecture d’un autre participant','Facultatif, à compléter uniquement si effectué',2)}<label class="checkboxline"><input type="checkbox" id="humanReview" ${humanReviewed?'checked':''}> Je déclare avoir personnellement relu et modifié le texte. Cette déclaration n’est pas une validation officielle.</label><div class="editor-actions">${btn('Télécharger la V2 corrigée','exportV2','primary')}${btn('Exporter la grille de relecture','exportReview')}</div><div class="note">V2 = <code>03-documents/guide-pratique-v2-a-relire.md</code>. Le modèle historique de l’été utilise aussi le nom <code>guide-pratique-v1-corrige.md</code>.</div></section></main>`}
function promptsPage(){return `<main class="page">${pageTitle('5 PROMPTS CANDIDAT','Du brouillon à la preuve','Prompts inspirés des supports de l’été et adaptés au dossier professionnel Automne 2026.')}
<div class="prompt-list">${prompts.map(([title,fn],i)=>`<section class="panel prompt-card"><div class="flexline"><h2>${title}</h2>${btn('Copier','copyPrompt'+i)}</div><pre>${esc(fn())}</pre></section>`).join('')}</div><p class="note">Ces consignes ne déclenchent aucun appel IA. Copiez-les vers votre outil choisi, puis vérifiez les réponses avant exploitation.</p></main>`}
function flashcards(){const f=DATA.flashcards[flash];return `<main class="page">${pageTitle('12 FLASHCARDS','Réviser les idées essentielles','Retournez la carte pour lire la réponse, puis avancez.')}
<div class="flash-area"><span class="tag">CARTE ${flash+1} / 12</span><button type="button" id="flipCard" class="flash-card" aria-label="Retourner la flashcard"><span class="eyebrow">${flipped?'RÉPONSE':'QUESTION'}</span><strong>${esc(flipped?f.a:f.q)}</strong><small>Cliquer pour retourner</small></button><div class="pager">${btn('← Carte précédente','flashPrev')}${btn('Retourner la carte','flashFlip')}${btn('Carte suivante →','flashNext','primary')}</div></div></main>`}
function quiz(){return `<main class="page">${pageTitle('10 QUESTIONS · AUTO-ÉVALUATION','Vérifier sa compréhension','Ce quiz mesure des connaissances, pas la validité documentaire de votre guide.')}
<div class="quiz-list">${DATA.quiz.map((q,i)=>`<fieldset class="panel quiz-question"><legend><b>${i+1}.</b> ${esc(q.q)}</legend>${q.options.map((o,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" ${quizAnswers[i]===j?'checked':''}> ${esc(o)}</label>`).join('')}${quizGraded?`<p class="answer ${quizAnswers[i]===q.answer?'correct':'incorrect'}">${quizAnswers[i]===q.answer?'Bonne réponse':'À revoir'} — ${esc(q.why)}</p>`:''}</fieldset>`).join('')}</div><div class="editor-actions">${btn('Corriger mes réponses','gradeQuiz','primary')}${btn('Télécharger autoévaluation','exportQuiz')}${btn('Recommencer','resetQuiz')}</div>${quizGraded?`<div class="notice"><strong>Résultat : ${DATA.quiz.filter((q,i)=>quizAnswers[i]===q.answer).length}/10</strong><span>À interpréter comme autoévaluation, non comme validation du livrable.</span></div>`:''}</main>`}
function validation(){return `<main class="page">${pageTitle('CONTRÔLE HUMAIN','Grille de relecture','Un outil pour guider le contrôle, sans attester de l’exactitude des documents.')}
<div class="panel"><h2>Dix critères à vérifier</h2>${DATA.checks.map((t,i)=>`<label class="checkitem"><input type="checkbox" data-check="${i}" ${checkState[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}<div class="notice"><b>${Object.values(checkState).filter(Boolean).length}/10 critères cochés</b><span>Le statut reste « À RELIRE / À VALIDER » quel que soit le score.</span></div>${btn('Télécharger la grille','exportReview','primary')}</div></main>`}
function portfolio(){return `<main class="page">${pageTitle('TRAÇABILITÉ · CAPITALISATION','Le livrable devient une preuve','L’atelier n’envoie ni formulaire ni fichier vers un serveur. Exportez vos documents et classez-les localement.')}
<div class="twocol"><section class="panel"><h2>Preuve de la séance 12</h2>${label('lessons','Ce que j’ai appris','Décrivez un apprentissage réellement effectué',3)}${label('portfolioAction','Ce que je souhaite améliorer','Écrivez une prochaine action',3)}${btn('Télécharger la preuve S12','exportProof','primary')}</section><section class="panel"><h2>Bilan du Module 03</h2><p>Vérifiez que vos quatre séances forment un dossier cohérent. Le bilan rappelle les productions S09, S10, S11, S12 et les preuves associées.</p>${btn('Télécharger le bilan du Module 03','exportBilan','primary')}<div class="note">Ne déclarez pas des travaux non réalisés comme validés.</div></section></div><section class="panel"><h2>Classement recommandé</h2><pre class="file-tree">challenge-100jours/\n├── 02-prompts/\n│   └── prompt-guide-s12.md\n├── 03-documents/\n│   ├── note-cadrage-courte.md  (S09)\n│   ├── fiche-projet-v1.md     (S10)\n│   ├── plan-guide-pratique.md (S11)\n│   ├── guide-pratique-v1.md   (S12)\n│   ├── guide-pratique-v2-a-relire.md (S12)\n│   └── grille-relecture-s12.md\n└── 07-portfolio/\n    ├── preuve-seance-12.md\n    └── bilan-module-03.md</pre></section></main>`}
function ressources(){return `<main class="page">${pageTitle('DOCUMENTATION ET SOURCES','Ressources & préparation','Consultez les supports et préparez la validation du Module 03.')}
<div class="resource-grid">${[['Atelier S09','Note de cadrage','https://elhisse-clprepas.github.io/atelier-seance-09-ln-ia/'],['Atelier S10','Fiche projet V1','https://elhisse-clprepas.github.io/atelier-seance-10-ln-ia/'],['Atelier S11','Plan du guide','https://elhisse-clprepas.github.io/atelier-seance-11-ln-ia/'],['Documentation Vite','Développement et publication','https://vite.dev/guide/'],['GitHub Pages','Site et workflow de publication','https://docs.github.com/en/pages']].map(([t,sub,url])=>`<a class="panel resource" href="${url}" target="_blank" rel="noopener noreferrer"><h2>${t} ↗</h2><p>${sub}</p><small>${url}</small></a>`).join('')}</div><section class="panel"><h2>Préparation de fin de module</h2><p>Rassemblez les livrables et prouvez que vous savez passer d’un besoin à un document contrôlé. Les sources de l’été sont archivées dans le ZIP. Les affiches de S12 seront réalisées ultérieurement.</p><p><b>Déploiement cible :</b> <a target="_blank" rel="noopener noreferrer" href="https://github.com/elhisse-CLPrepas/atelier-seance-12-ln-ia">GitHub — atelier-seance-12-ln-ia</a> (publication non présumée).</p></section></main>`}
function bind(){const route=nav();$$('[data-field]').forEach(el=>el.oninput=()=>{state[el.dataset.field]=el.value;persist();humanReviewed=false;const recheck=$('#humanReview');if(recheck)recheck.checked=false;const p=$('#markdownPreview');if(p)p.textContent=guideV1();});
$$('[data-import]').forEach(input=>input.onchange=async()=>{const file=input.files?.[0];if(!file)return;if(file.size>1048576){message('Import refusé : limite de 1 Mo.');input.value='';return}if(!/\.(md|txt)$/i.test(file.name)){message('Import refusé : format .md ou .txt attendu.');return}const text=await file.text();state[input.dataset.import]=text;persist();render();message('Document importé localement : '+file.name);});
$$('[data-slide]').forEach(el=>el.onclick=()=>{slide=Number(el.dataset.slide);render()});$$('[data-check]').forEach(el=>el.onchange=()=>{checkState[el.dataset.check]=el.checked;render()});
$$('input[type=radio][name^=q]').forEach(el=>el.onchange=()=>{quizAnswers[Number(el.name.slice(1))]=Number(el.value)});
const cb=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
cb('prevSlide',()=>{slide=(slide+21)%22;render()});cb('nextSlide',()=>{slide=(slide+1)%22;render()});cb('toggleNotes',()=>{notes=!notes;render()});cb('fullScreen',async()=>{const p=$('#slideDeck');if(!document.fullscreenElement)try{await p.requestFullscreen()}catch{message('Plein écran indisponible sur ce navigateur.')}else await document.exitFullscreen()});
DATA.cases.forEach((c,i)=>cb('loadCase'+i,()=>{if(!loadCase(i))return;location.hash='#atelier';render();message('Exemple FICTIF chargé dans le formulaire. Remplacez-le par votre projet personnel.') }));
cb('sampleCase',()=>{if(!loadCase(3))return;render();message('Cas pédagogique fictif chargé. Remplacez les données avant un travail réel.')});
cb('clearForm',()=>{if(!confirm('Effacer le formulaire local de la séance 12 ? Exportez d’abord vos fichiers.'))return;state=defaults();v1Snapshot='';selectedCase=-1;humanReviewed=false;persist();render();message('Formulaire vidé.');});
cb('previewV1',()=>{const p=$('#markdownPreview');if(p){p.textContent=guideV1();p.scrollIntoView({behavior:'smooth',block:'nearest'})}});
cb('exportV1',()=>{const required=['title','audience','goal','outcome',...([1,2,3].flatMap(n=>['step'+n+'Title','step'+n+'Actions','step'+n+'Check']))];if(required.some(k=>!state[k].trim())){message('V1 non exportée : complétez le titre, le public, le résultat, l’objectif et les trois étapes avec leur contrôle.');return}v1Snapshot=guideV1();persist();localFile('guide-pratique-v1.md',v1Snapshot);});
cb('exportPrompt',()=>localFile('prompt-guide-s12.md',productionPrompt()));
cb('prefillV2',()=>{if(!v1Snapshot){message('Téléchargez d’abord la V1 pour établir la version de référence.');return}if(state.revisedV2.trim()&&!confirm('Remplacer le texte V2 actuel par la base V1 ?'))return;humanReviewed=false;state.revisedV2=v1Snapshot.replace('**Version :** V1 — À RELIRE / validation humaine requise','**Version :** V2 — À RELIRE / validation humaine requise');persist();render();message('Base V1 recopiée. Modifiez effectivement les instructions et décrivez vos corrections.')});
cb('copyCorrection',()=>copyText(prompts[3][1]()));cb('exportV2',()=>{if(!v1Snapshot){message('V2 non exportée : téléchargez d’abord la V1.');return}if(!state.revisedV2.trim()||!state.correctionLog.trim()||!humanReviewed){message('V2 non exportée : saisissez le texte révisé, le journal de corrections et cochez la relecture humaine.');return}const ref=v1Snapshot.replace('**Version :** V1 — À RELIRE / validation humaine requise','**Version :** V2 — À RELIRE / validation humaine requise').trim();if(state.revisedV2.trim()===ref||state.revisedV2.trim()===v1Snapshot.trim()){message('V2 non exportée : aucun changement de contenu détecté. Modifiez réellement le texte avant export.');return}localFile('guide-pratique-v2-a-relire.md',guideV2())});
cb('humanReview',()=>{});const review=$('#humanReview');if(review)review.onchange=()=>{humanReviewed=review.checked};
cb('exportReview',()=>localFile('grille-relecture-s12.md',validationMd()));cb('exportProof',()=>localFile('preuve-seance-12.md',proofMd()));cb('exportBilan',()=>localFile('bilan-module-03.md',bilanMd()));
prompts.forEach(([t,fn],i)=>cb('copyPrompt'+i,()=>copyText(fn())));
cb('flashFlip',()=>{flipped=!flipped;render()});cb('flipCard',()=>{flipped=!flipped;render()});cb('flashPrev',()=>{flash=(flash+11)%12;flipped=false;render()});cb('flashNext',()=>{flash=(flash+1)%12;flipped=false;render()});
cb('gradeQuiz',()=>{quizGraded=true;render()});cb('resetQuiz',()=>{quizAnswers={};quizGraded=false;render()});cb('exportQuiz',()=>localFile('autoevaluation-seance-12.md','# Auto-évaluation Séance 12\n\nScore : '+DATA.quiz.filter((q,i)=>quizAnswers[i]===q.answer).length+'/10\n\n'+DATA.quiz.map((q,i)=>`${i+1}. ${q.q}\nRéponse du participant : ${q.options[quizAnswers[i]]??'Non répondu'}\nAttendu : ${q.options[q.answer]}\n${q.why}`).join('\n\n')+'\n\n*Autoévaluation non certifiante.*'));
}
function copyText(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>message('Prompt copié dans le presse-papiers.')).catch(()=>message('Copie impossible. Sélectionnez le texte directement dans la rubrique Prompts.'));else message('Presse-papiers non disponible : sélectionnez le texte dans la rubrique Prompts.');}
function loadCase(index){if(fields.some(k=>state[k].trim())&&!confirm('Charger cet exemple remplacera votre travail actuel. Exportez vos documents avant de continuer. Continuer ?'))return false;const c=DATA.cases[index];selectedCase=index;Object.assign(state,{title:'Guide pratique — '+c.name,audience:c.audience,goal:c.goal,outcome:c.goal,prereqs:c.prereq,errors:c.errors,checklist:c.checklist,verify:c.verify,improve:'Tester le guide avec un lecteur du public visé.',correctionLog:'',revisedV2:'',lessons:'',portfolioAction:'',peerFeedback:''});c.steps.forEach((st,i)=>{const n=i+1;state['step'+n+'Title']=st[0];state['step'+n+'Actions']=st[1];state['step'+n+'Check']=st[2]});v1Snapshot='';humanReviewed=false;persist();return true}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
window.addEventListener('keydown',e=>{if(nav()!=='presentation'||/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement?.tagName||''))return;if(e.key==='ArrowRight'){e.preventDefault();slide=(slide+1)%22;render()}if(e.key==='ArrowLeft'){e.preventDefault();slide=(slide+21)%22;render()}});
render();
</script></body></html>
